      isSeniorMode = !isSeniorMode;

        body.classList.add("senior-text-mode");
        text.textContent = "字體：特大 (A+)";
        showToast("已切換為【長輩特大字體】模式");

        body.classList.remove("senior-text-mode");

        showToast("已切換為【標準字體】模式");

    // 切換 壽險 / 產險 分類

              ` : `

                  <i class="ph-bold ph-info text-base"></i> 說明項目

              `}
            </div>

            <!-- 下方靜態說明卡 (超大字縱向自適應，文字多長就自動長多高，絕不截斷) -->
            <div class="p-4 sm:p-6 space-y-4">
              
              <!-- 用途說明 -->
              <div class="detail-static-box rounded-2xl p-4 sm:p-5 border-2 border-warm-200 shadow-2xs">
                <div class="text-xs sm:text-sm font-black text-warm-800 tracking-wider flex items-center gap-2 mb-1.5">

    // 返回第一層主清單
    function goHome() {
      document.getElementById("view-detail").classList.add("hidden");
      document.getElementById("view-home").classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: "instant" });
    }

    // 一鍵複製函式 (相容所有行動瀏覽器)
    function copyText(text, successMsg) {
      try {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        document.body.removeChild(textarea);
        showToast(successMsg);
      } catch (e) {
        showToast("複製失敗，請手動複製");
      }
    }

    let toastTimer = null;
    function showToast(msg) {
      const toast = document.getElementById("toast");
      const text = document.getElementById("toast-text");
      text.textContent = msg;

      toast.classList.remove("opacity-0", "translate-y-4", "pointer-events-none");
      toast.classList.add("opacity-100", "translate-y-0");

      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove("opacity-100", "translate-y-0");
        toast.classList.add("opacity-0", "translate-y-4", "pointer-events-none");
      }, 2500);
    }

    // 啟動初始化
    window.addEventListener("DOMContentLoaded", () => {
      document.getElementById("view-home").classList.remove("hidden");

            account: "通路代號：6AH ｜ 帳號：身分證字號",
            copyAccount: "6AH",
            password: "密碼：密碼寄至信箱",
            notes: "通路代號為 6AH，密碼請查看信箱。"
          },
          {

            purpose: "下載旅平險專用要保文件與商品 DM",
            account: "免帳號",
            password: "免密碼",
            notes: "免帳密直接下載。"
          },
          {
            title: "安達產物 各式理賠文件下載區",
            url: "https://www.chubb.com/tw-zh/customer-service/claim-forms-for-individual.html",
            purpose: "個人理賠申請書與應附文件下載",
            account: "免帳號",

      },
      {
        id: "cathay-prop",

        name: "國泰產物",
        type: "產險",
        items: [
          {
            title: "國泰產物 BTB 線上操作入口",
            url: "https://b2b.cathay-ins.com.tw/INSBAWeb/html/CM/loginb2b.jsp",
            purpose: "BTB 線上產險操作系統",
            account: "身分證字號 (請至國泰找熊思琪申請)",
            password: "密碼：abcd12 (需自行變更密碼)",
            copyPassword: "abcd12",
            notes: "登入時【來源】請務必選擇【保經代人員】。"
          }
        ]
      },
      {
        id: "tfmi-prop",
        code: "Z16",
        name: "台灣產物",
        type: "產險",
        items: [
          {
            title: "台灣產物 旅平險線上報價投保",
            url: "https://dp.tfmi.com.tw/DigitalPortal/Account/Login",
            purpose: "台灣產物旅平線上報價與投保",
            account: "初次登錄：統編-身份證",
            password: "密碼：123456 (記得變更密碼並記住)",
            copyPassword: "123456",
            notes: "初次登錄密碼為 123456，變更完後請牢記密碼。"
          }
        ]
      }
    ];

    let currentTab = "壽險";

    // 核心切換函式：定義並掛載至 window 確保全域可用
    window.setTab = function(tab) {
      currentTab = tab;
      const btnLife = document.getElementById("btn-tab-life");
      const btnProperty = document.getElementById("btn-tab-property");
      const badgeLife = document.getElementById("badge-tab-life");
      const badgeProperty = document.getElementById("badge-tab-property");
      const statusLabel = document.getElementById("status-display-label");

      const activeBeaconHtml = `
        <span class="relative flex h-3.5 w-3.5 sm:h-4 sm:w-4 items-center justify-center">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-300 opacity-80"></span>
          <span class="relative inline-flex rounded-full h-2.5 w-2.5 sm:h-3 sm:w-3 bg-emerald-400 breathing-beacon-glow border border-white"></span>
        </span>
        <span>目前選取中</span>
      `;

      if (tab === "壽險") {
        btnLife.className = "btn-3d py-3.5 sm:py-5 px-2 sm:px-3 rounded-2xl font-black text-lg sm:text-2xl flex flex-col items-center justify-center gap-1.5 sm:gap-2 bg-warm-600 text-white shadow-md border-b-4 border-warm-700";
        badgeLife.className = "inline-flex items-center gap-1.5 sm:gap-2 text-xs sm:text-base px-2.5 sm:px-3.5 py-0.5 sm:py-1 rounded-xl font-black bg-white/25 text-white border border-white/40 shadow-inner";
        badgeLife.innerHTML = activeBeaconHtml;

        btnProperty.className = "btn-3d py-3.5 sm:py-5 px-2 sm:px-3 rounded-2xl font-black text-lg sm:text-2xl flex flex-col items-center justify-center gap-1.5 sm:gap-2 bg-white text-warm-900 border-2 border-warm-300 hover:bg-warm-50";
        badgeProperty.className = "text-xs sm:text-base px-2.5 sm:px-3 py-0.5 rounded-lg font-black bg-warm-100 text-warm-800 border border-warm-200";
        badgeProperty.textContent = "點我切換";

        statusLabel.textContent = "壽險專區 (16家)";
      } else {
        btnProperty.className = "btn-3d py-3.5 sm:py-5 px-2 sm:px-3 rounded-2xl font-black text-lg sm:text-2xl flex flex-col items-center justify-center gap-1.5 sm:gap-2 bg-warm-600 text-white shadow-md border-b-4 border-warm-700";
        badgeProperty.className = "inline-flex items-center gap-1.5 sm:gap-2 text-xs sm:text-base px-2.5 sm:px-3.5 py-0.5 sm:py-1 rounded-xl font-black bg-white/25 text-white border border-white/40 shadow-inner";
        badgeProperty.innerHTML = activeBeaconHtml;

        btnLife.className = "btn-3d py-3.5 sm:py-5 px-2 sm:px-3 rounded-2xl font-black text-lg sm:text-2xl flex flex-col items-center justify-center gap-1.5 sm:gap-2 bg-white text-warm-900 border-2 border-warm-300 hover:bg-warm-50";
        badgeLife.className = "text-xs sm:text-base px-2.5 sm:px-3 py-0.5 rounded-lg font-black bg-warm-100 text-warm-800 border border-warm-200";
        badgeLife.textContent = "點我切換";

        statusLabel.textContent = "產險專區 (10家)";
      }

      renderCompanyCards();
    };

    // 渲染第一層：手機雙排超大黑體卡片 (左代號、右公司名，全卡按壓變橘色)
    function renderCompanyCards() {
      const grid = document.getElementById("company-card-grid");
      if (!grid) return;

      const list = INSURANCE_DATA.filter(c => c.type === currentTab);

      grid.innerHTML = list.map(c => `
        <div 
          onclick="openDetail('${c.id}')"
          class="btn-3d group bg-white hover:bg-gradient-to-r hover:from-warm-600 hover:to-warm-500 active:from-warm-600 active:to-warm-500 rounded-2xl sm:rounded-3xl p-3 sm:p-5 border-2 border-warm-200 hover:border-warm-600 shadow-xs hover:shadow-md flex items-center gap-2.5 sm:gap-3.5 cursor-pointer select-none transition-all duration-150 active:scale-[0.98]"
        >
          <!-- 前面代號：維持原色米黃底與深字 -->
          <span class="font-mono text-base sm:text-xl font-black px-2.5 py-1 sm:px-3.5 sm:py-1.5 rounded-xl bg-warm-100 text-warm-950 border border-warm-300 shadow-xs shrink-0">
            ${c.code}
          </span>
          <!-- 超大公司名稱：按壓/懸停變為高對比純白字 -->
          <h3 class="text-lg sm:text-2xl font-black text-warm-950 group-hover:text-white group-active:text-white transition-colors tracking-tight truncate leading-tight">
            ${c.name}
          </h3>
        </div>
      `).join("");
    }

    // 開啟第二層：子項目詳情頁
    window.openDetail = function(companyId) {
      const company = INSURANCE_DATA.find(c => c.id === companyId);
      if (!company) return;

      document.getElementById("view-home").classList.add("hidden");
      document.getElementById("view-detail").classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: "instant" });

      document.getElementById("detail-code-badge").textContent = company.code;
      document.getElementById("detail-company-title").textContent = company.name;
      document.getElementById("detail-item-count-badge").textContent = `共 ${company.items.length} 個項目`;

      const container = document.getElementById("detail-items-container");

      // 嚴格 2 個區塊設計 + 醒目 01, 02 序號徽章
      container.innerHTML = company.items.map((item, index) => {
        const itemNumber = String(index + 1).padStart(2, '0');
        const isExternal = item.url && item.url !== "#";
        const hasWarning = item.notes && item.notes.includes("⚠️");

        return `
          <article class="bg-white rounded-3xl border-2 border-warm-200 shadow-sm overflow-hidden flex flex-col">
            
            <!-- 【區塊 1 / 上半部】：序號 + 功能標題 ＋ 超大【👉 點此開啟】實體按鈕 -->
            <div class="p-4 sm:p-5 bg-gradient-to-r from-warm-100 via-warm-100 to-warm-50 flex flex-col sm:flex-row sm:items-center justify-between gap-3 sm:gap-4 border-b-2 border-warm-200">
              <div class="flex items-center gap-3">
                <!-- 醒目序號徽章 (01, 02, 03...) -->
                <div class="w-11 h-11 sm:w-12 sm:h-12 rounded-2xl bg-white text-warm-900 border-2 border-warm-300 flex items-center justify-center font-mono font-black text-lg sm:text-xl shadow-xs shrink-0">
                  ${itemNumber}
                </div>
                <div>
                  <h4 class="text-xl sm:text-2xl font-black tracking-tight leading-snug text-warm-950">
                    ${item.title}
                  </h4>
                  <span class="text-xs sm:text-sm font-bold text-warm-700 flex items-center gap-1.5 mt-0.5">
                    <span class="w-2 h-2 rounded-full bg-warm-600"></span>
                    重要連結項目
                  </span>
                </div>
              </div>

              <!-- 右側大按鈕：👉 點此開啟 -->
              ${isExternal ? `
                <a 
                  href="${item.url}" 
                  target="_blank" 
                  rel="noopener noreferrer" 
                  class="btn-3d inline-flex items-center justify-center gap-2 px-5 py-3 sm:px-7 sm:py-3.5 rounded-2xl bg-warm-600 hover:bg-warm-700 text-white font-black text-base sm:text-xl tracking-wide shrink-0 border-b-4 border-warm-800 shadow-md active:translate-y-0.5"
                >
                  <span class="anim-pointing-finger text-lg sm:text-xl">👉</span>
                  <span>點此開啟</span>
                  <i class="ph-bold ph-arrow-square-out text-lg sm:text-xl"></i>
                </a>
              ` : `
                <span class="inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-2xl bg-white border-2 border-warm-300 text-warm-800 text-sm sm:text-base font-bold shrink-0">
                  <i class="ph-bold ph-info text-base"></i> 說明項目
                </span>
              `}
            </div>

            <!-- 【區塊 2 / 下半部】：單一純白規則整合盒 (大字體排版) -->
            <div class="p-5 sm:p-6 space-y-4 bg-white text-warm-950">
              
              <!-- 條列 1：用途說明 -->
              <div class="space-y-1">
                <span class="inline-block font-black text-sm sm:text-base text-warm-800 tracking-wider">
                  • 【用途說明】
                </span>
                <p class="text-lg sm:text-xl font-bold leading-relaxed break-words pl-2 sm:pl-3 text-warm-950">
                  ${item.purpose}
                </p>
              </div>

              <div class="border-t border-warm-150"></div>

              <!-- 條列 2：帳號規則 -->
              <div class="space-y-2">
                <span class="inline-block font-black text-sm sm:text-base text-warm-800 tracking-wider">
                  • 【帳號規則】
                </span>
                <div class="pl-2 sm:pl-3 space-y-2">
                  <p class="font-mono text-lg sm:text-xl font-black text-warm-950 leading-relaxed break-words">
                    ${item.account}
                  </p>
                  ${item.copyAccount ? `
                    <button 
                      type="button"
                      onclick="copyText('${item.copyAccount}', '已成功複製帳號：${item.copyAccount}')"
                      class="btn-3d w-full py-2.5 px-4 rounded-xl font-black text-base sm:text-lg text-warm-900 bg-warm-100 hover:bg-warm-200 border-2 border-warm-300 shadow-xs flex items-center justify-center gap-2"
                    >
                      <i class="ph-bold ph-copy text-lg text-warm-600"></i>
                      <span>點此複製帳號：${item.copyAccount}</span>
                    </button>
                  ` : ''}
                </div>
              </div>

              <div class="border-t border-warm-150"></div>

              <!-- 條列 3：密碼規則 -->
              <div class="space-y-2">
                <span class="inline-block font-black text-sm sm:text-base text-warm-800 tracking-wider">
                  • 【密碼規則】
                </span>
                <div class="pl-2 sm:pl-3 space-y-2">
                  <p class="text-lg sm:text-xl font-black text-warm-950 leading-relaxed break-words">
                    ${item.password}
                  </p>
                  ${item.copyPassword ? `
                    <button 
                      type="button"
                      onclick="copyText('${item.copyPassword}', '已成功複製密碼：${item.copyPassword}')"
                      class="btn-3d w-full py-2.5 px-4 rounded-xl font-black text-base sm:text-lg text-warm-900 bg-warm-100 hover:bg-warm-200 border-2 border-warm-300 shadow-xs flex items-center justify-center gap-2"
                    >
                      <i class="ph-bold ph-copy text-lg text-warm-600"></i>
                      <span>點此複製密碼：${item.copyPassword}</span>
                    </button>
                  ` : ''}
                </div>
              </div>

              <!-- 條列 4：備註說明 / KYC 一年警語 -->
              ${item.notes ? `
                <div class="border-t border-warm-150 pt-2">
                  <div class="p-3.5 rounded-2xl ${hasWarning ? 'bg-amber-100/90 border-2 border-amber-400 text-amber-950 font-black shadow-xs' : 'bg-warm-50 border border-warm-200 text-warm-900 font-bold'} flex items-start gap-2.5 text-base sm:text-lg leading-relaxed">
                    <i class="ph-fill ${hasWarning ? 'ph-warning-circle text-amber-700' : 'ph-lightbulb text-warm-600'} text-xl mt-0.5 shrink-0"></i>
                    <span>${item.notes}</span>
                  </div>
                </div>
              ` : ''}

            </div>

          </article>
        `;
      }).join("");
    };

    // 返回第一層公司清單
    window.goHome = function() {
      document.getElementById("view-detail").classList.add("hidden");
      document.getElementById("view-home").classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: "instant" });
    };

    // 一鍵複製函式 (相容所有行動瀏覽器)
    window.copyText = function(text, successMsg) {
      try {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        document.body.removeChild(textarea);
        showToast(successMsg);
      } catch (e) {
        showToast("複製失敗，請手動複製");
      }
    };

    let toastTimer = null;
    function showToast(msg) {
      const toast = document.getElementById("toast");
      const text = document.getElementById("toast-text");
      text.textContent = msg;

      toast.classList.remove("opacity-0", "translate-y-4", "pointer-events-none");
      toast.classList.add("opacity-100", "translate-y-0");

      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove("opacity-100", "translate-y-0");
        toast.classList.add("opacity-0", "translate-y-4", "pointer-events-none");
      }, 2500);
    }

    // 啟動初始化
    window.addEventListener("DOMContentLoaded", () => {
      document.getElementById("view-home").classList.remove("hidden");
      document.getElementById("view-detail").classList.add("hidden");
      renderCompanyCards();
    });
  </script>
</body>

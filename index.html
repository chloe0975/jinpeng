    let currentTab = "壽險";

    // 切換分類 (壽險 / 產險)
    function setTab(tab) {
      currentTab = tab;
      const btnLife = document.getElementById("btn-tab-life");
      const btnProperty = document.getElementById("btn-tab-property");
      const badgeLife = document.getElementById("badge-tab-life");
      const badgeProperty = document.getElementById("badge-tab-property");
      const statusLabel = document.getElementById("status-display-label");

      if (tab === "壽險") {
        btnLife.className = "py-4 px-4 rounded-2xl font-black text-base sm:text-lg flex flex-col sm:flex-row items-center justify-center gap-2 transition-all duration-200 bg-amberwarm-600 text-white shadow-md border-b-4 border-amberwarm-700 active:translate-y-0.5";
        badgeLife.className = "text-xs px-2.5 py-0.5 rounded-lg font-bold bg-white/20 text-white border border-white/30";
        badgeLife.textContent = "目前選取中";

        btnLife.className = "py-4 px-4 rounded-2xl font-bold text-base sm:text-lg flex flex-col sm:flex-row items-center justify-center gap-2 transition-all duration-200 bg-white text-amberwarm-800 border-2 border-amberwarm-200 hover:bg-amberwarm-50";
        badgeLife.className = "text-xs px-2.5 py-0.5 rounded-lg font-bold bg-amberwarm-100 text-amberwarm-800 border border-amberwarm-200";
        badgeLife.textContent = "點我切換";

        statusLabel.textContent = "產險專區 (9家)";

    // 渲染第一層：公司卡片
    function renderCompanyCards() {
      const grid = document.getElementById("company-card-grid");
      const list = INSURANCE_DATA.filter(c => c.type === currentTab);

      grid.innerHTML = list.map(c => `
        <div 
          onclick="openDetail('${c.id}')"
          class="card-company bg-white rounded-3xl p-4 sm:p-5 border-2 border-amberwarm-150 shadow-xs cursor-pointer flex flex-col justify-between group"
        >
          <div class="flex items-center justify-between">
            <span class="font-mono text-xs font-black px-3 py-1 rounded-xl bg-amberwarm-100 text-amberwarm-800 border border-amberwarm-200">
              ${c.code}
            </span>
            <span class="text-xs font-bold text-amberwarm-700 bg-amberwarm-50 px-2.5 py-1 rounded-full border border-amberwarm-150">
              ${c.items.length} 個連結
            </span>
          </div>

          <div class="mt-4 pt-2">
            <h3 class="text-lg sm:text-xl font-black text-amberwarm-900 group-hover:text-amberwarm-600 transition-colors tracking-tight">
              ${c.name}
            </h3>
            <div class="mt-2.5 flex items-center justify-between text-xs font-black text-amberwarm-700 group-hover:text-amberwarm-900">
              <span class="flex items-center gap-1.5">
                <span class="text-sm">👉</span> 點擊查看帳密與連結
              </span>
              <i class="ph-bold ph-caret-right text-base text-amberwarm-400 group-hover:text-amberwarm-700 group-hover:translate-x-1 transition-all"></i>
            </div>
          </div>
        </div>
      `).join("");
    }

    // 開啟第二層：單一公司細項
    function openDetail(companyId) {
      const company = INSURANCE_DATA.find(c => c.id === companyId);
      if (!company) return;

      document.getElementById("view-home").classList.add("hidden");
      document.getElementById("view-detail").classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: "instant" });

      document.getElementById("detail-code-badge").textContent = company.code;
      document.getElementById("detail-company-title").textContent = company.name;
      document.getElementById("detail-item-count-badge").textContent = `共 ${company.items.length} 個常用項目`;

      const container = document.getElementById("detail-items-container");

      // 渲染細項卡片：重心放在【整座功能大卡片】與【頂部淺黃標題列】
      container.innerHTML = company.items.map((item, idx) => {
        const isExternal = item.url && item.url !== "#";

        return `
          <!-- 核心：功能項目大卡片 (點選整張卡片可聚焦高亮) -->
          <article 
            tabindex="0"
            role="region"
            aria-label="${item.title}"
            onclick="selectFeatureCard(this)"
            class="feature-card bg-amberwarm-50 rounded-3xl border-2 border-amberwarm-150 shadow-xs overflow-hidden cursor-pointer"
          >
            <!-- 上方重點：淺黃標題橫列 (如：商品文件業務專區) -->
            <div class="p-4 sm:p-5 bg-gradient-to-r from-amberwarm-100 via-amberwarm-100 to-amberwarm-50 text-amberwarm-900 flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b-2 border-amberwarm-150">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-white text-amberwarm-600 flex items-center justify-center text-xl font-bold shrink-0 border border-amberwarm-200 shadow-xs">
                  <i class="ph-bold ph-link-simple"></i>
                </div>
                <div>
                  <h4 class="text-base sm:text-lg font-black tracking-tight leading-snug text-amberwarm-900">
                    ${item.title}
                  </h4>
                  <div class="flex items-center gap-2 mt-0.5">
                    <span class="text-[11px] font-bold text-amberwarm-700 flex items-center gap-1">
                      <span class="w-1.5 h-1.5 rounded-full bg-amberwarm-500"></span>
                      功能重點項目
                    </span>
                    <span class="card-focus-tag hidden items-center gap-1 text-[11px] font-black px-2 py-0.5 rounded-md bg-amberwarm-600 text-white shadow-xs">
                      <i class="ph-bold ph-check"></i> 目前選取中
                    </span>
                  </div>
                </div>
              </div>

              <!-- 右方醒目大按鈕：點此開啟 (帶動態手勢) -->
              ${isExternal ? `
                <a 
                  href="${item.url}" 
                  target="_blank" 
                  rel="noopener noreferrer"
                  onclick="event.stopPropagation();"
                  class="btn-press inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-2xl bg-amberwarm-600 hover:bg-amberwarm-700 text-white font-black text-sm tracking-wide shrink-0 border-b-3 border-amberwarm-800"
                >
                  <span class="anim-pointing-finger text-base">👉</span>
                  <span>點此開啟</span>
                  <i class="ph-bold ph-arrow-square-out text-amberwarm-100 text-sm"></i>
                </a>
              ` : `
                <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-white border border-amberwarm-200 text-amberwarm-800 text-xs font-bold shrink-0" onclick="event.stopPropagation();">
                  <i class="ph-bold ph-info"></i> 規則須知
                </span>
              `}
            </div>

            <!-- 下方純靜態說明框：回歸純說明，不再有選取外框與提示干擾，排版自動換行撐高 -->

              <!-- 用途說明 -->
              <div class="detail-static-box rounded-2xl p-4 border border-amberwarm-150 shadow-2xs">
                <div class="text-xs font-black text-amberwarm-700 tracking-wider flex items-center gap-1.5 mb-1">
                  <span class="w-2 h-2 rounded-full bg-amberwarm-500"></span>
                  <span>【用途說明】</span>
                </div>
                <p class="text-sm sm:text-base font-bold text-amberwarm-900 leading-relaxed break-words">
                  ${item.purpose}
                </p>
              </div>

              <!-- 帳號規則 (純說明＋獨立複製鍵) -->
              <div class="detail-static-box rounded-2xl p-4 border border-amberwarm-150 shadow-2xs space-y-2">
                <div class="flex items-center justify-between">
                  <div class="text-xs font-black text-amberwarm-700 tracking-wider flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-amberwarm-500"></span>
                    <span>【帳號規則】</span>
                  </div>
                  ${item.copyAccount ? `
                    <button 
                      type="button"
                      onclick="copyText('${item.copyAccount}', '已複製帳號代碼：${item.copyAccount}')"
                      class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-black text-amberwarm-800 bg-amberwarm-100 hover:bg-amberwarm-200 border border-amberwarm-300 active:scale-95 transition-all shadow-xs"
                    >
                      <i class="ph-bold ph-copy"></i>
                      <span>複製 ${item.copyAccount}</span>
                    </button>
                  ` : ''}
                </div>
                <p class="font-mono text-sm sm:text-base font-extrabold text-amberwarm-900 leading-relaxed break-words">
                  ${item.account}
                </p>
              </div>

              <!-- 密碼規則 (純說明＋獨立複製鍵) -->
              <div class="detail-static-box rounded-2xl p-4 border border-amberwarm-150 shadow-2xs space-y-2">
                <div class="flex items-center justify-between">
                  <div class="text-xs font-black text-amberwarm-700 tracking-wider flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-amberwarm-500"></span>
                    <span>【密碼規則】</span>
                  </div>
                  ${item.copyPassword ? `
                    <button 
                      type="button"
                      onclick="copyText('${item.copyPassword}', '已複製密碼：${item.copyPassword}')"
                      class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-black text-amberwarm-800 bg-amberwarm-100 hover:bg-amberwarm-200 border border-amberwarm-300 active:scale-95 transition-all shadow-xs"
                    >
                      <i class="ph-bold ph-copy"></i>
                      <span>複製密碼</span>
                    </button>
                  ` : ''}
                </div>
                <p class="text-sm sm:text-base font-extrabold text-amberwarm-900 leading-relaxed break-words">
                  ${item.password}
                </p>
              </div>

              <!-- 備註說明 (若有則顯示) -->
              ${item.notes ? `
                <div class="p-3.5 rounded-2xl bg-white/90 border border-amberwarm-200 flex items-start gap-2.5 text-xs font-bold text-amberwarm-800 leading-relaxed shadow-2xs">
                  <i class="ph-fill ph-lightbulb text-amberwarm-500 text-sm mt-0.5 shrink-0"></i>
                  <span>${item.notes}</span>
                </div>
              ` : ''}

            </div>

          </article>
        `;
      }).join("");
    }

    // 點選「整座功能大卡片」時切換聚焦狀態
    function selectFeatureCard(cardEl) {
      const isAlreadySelected = cardEl.classList.contains("card-selected");
      document.querySelectorAll(".feature-card").forEach(el => {
        el.classList.remove("card-selected");
      });
      if (!isAlreadySelected) {
        cardEl.classList.add("card-selected");
      }
    }

    // 返回首頁清單
    function goHome() {
      document.getElementById("view-detail").classList.add("hidden");
      document.getElementById("view-home").classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: "instant" });
    }

    // 一鍵複製函式 (相容 iFrame / 行動瀏覽器)
    function copyText(text, successMsg) {
      try {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        document.body.removeChild(textarea);
        showToast(successMsg);
      } catch (e) {
        showToast("複製失敗，請手動選取複製");
      }
    }

    let toastTimer = null;
    function showToast(msg) {
      const toast = document.getElementById("toast");
      const text = document.getElementById("toast-text");
      text.textContent = msg;

      toast.classList.remove("opacity-0", "translate-y-3", "pointer-events-none");
      toast.classList.add("opacity-100", "translate-y-0");

      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove("opacity-100", "translate-y-0");
        toast.classList.add("opacity-0", "translate-y-3", "pointer-events-none");
      }, 2000);
    }

    // 啟動渲染
    window.addEventListener("DOMContentLoaded", () => {
      renderCompanyCards();
    });
  </script>
